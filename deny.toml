# Root options

# The graph table configures how the dependency graph is constructed and thus
# which crates the checks are performed against
[graph]
targets             = [
  # These will be enabled later
  # "aarch64-unknown-linux-musl",
  # "x86_64-unknown-linux-musl",
]
exclude             = []
all-features        = false
no-default-features = false
# features = []

# The output table provides options for how/if diagnostics are outputted
[output]
feature-depth = 1

[advisories]
ignore = [
  { id = "RUSTSEC-2026-0370", reason = "zvariant is folded into zbus but keyring hasn't migrated off it"},
  { id = "RUSTSEC-2026-0371", reason = "zbus_names is folded into zbus but keyring hasn't migrated off it"},
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained but keyring hasn't migrated off it"},
]
# git-fetch-with-cli = true

[licenses]
# List of explicitly allowed licenses
# See https://spdx.org/licenses/ for list of possible licenses
# [possible values: any SPDX 3.11 short identifier (+ optional exception)].
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "bzip2-1.0.6",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

confidence-threshold = 0.8
exceptions           = [
  # { name = "webpki-roots-certs", allow = ["MPL-2.0", "CDLA-Permissive-2.0"], version = "*" },
]

# [[licenses.clarify]]
# crate = "ring"
# expression = "MIT AND ISC AND OpenSSL"
# license-files = [
# Each entry is a crate relative path, and the (opaque) hash of its contents
# { path = "LICENSE", hash = 0xbd0eed23 }
# ]

[licenses.private]
ignore     = false
registries = [
  # "https://sekretz.com/registry
]

[bans]
multiple-versions          = "warn"
wildcards                  = "allow"
highlight                  = "all"
workspace-default-features = "allow"
external-default-features  = "allow"
# List of crates that are allowed. Use with care!
allow                      = [
  # "ansi_term@0.11.0",
  # { crate = "ansi_term@0.11.0", reason = "you can specify a reason it is allowed" },
]
# List of crates to deny
deny                       = [
  # "ansi_term@0.11.0",
  # { crate = "ansi_term@0.11.0", reason = "you can specify a reason it is banned" },
  # { crate = "ansi_term@0.11.0", wrappers = ["this-crate-directly-depends-on-ansi_term"] },
]

# [[bans.features]]
# crate = "reqwest"
# Features to not allow
# deny = ["json"]
# Features to allow
# allow = [
#    "rustls",
#    "__rustls",
#    "__tls",
#    "hyper-rustls",
#    "rustls",
#    "rustls-pemfile",
#    "rustls-tls-webpki-roots",
#    "tokio-rustls",
#    "webpki-roots",
# ]
# exact = true

# Certain crates/versions that will be skipped when doing duplicate detection.
skip      = [
    { crate = "core-foundation", reason = "aws-sdk" },
    { crate = "getrandom", reason = "rand and resolvo bring in different versions"},
    { crate = "foldhash", reason = "petgraph vs indexmap" },
    { crate = "hashbrown", reason = "dashmap and petgraph have two different versions"},
    { crate = "lock_api", reason = "dashmap" },
    { crate = "parking_lot", reason = "aws-sdk and tokio" },
    { crate = "parking_lot_core", reason = "dashmap caused" },
    { crate = "rand", reason = "names relies on old version but we use latest"},
    { crate = "rand_core", reason = "product of getrandom" },
    { crate = "redox_syscall", reason = "dashmap and aws-sdk use different parking_lot leading to this"},
    { crate = "r-efi", reason = "product of getrandom" },
    { crate = "supports-color", reason = "owo-colors brings in two copies"},
    { crate = "syn", reason = "rust ecosystem and aws-sdk has not moved to 3.0 yet"}
]
skip-tree = [
  { crate = "darling", depth = 2, reason = "derive_builder vs bon" },
  { crate = "sha1", depth = 3, reason = "sha1 collision in aws sdk" }
  # The aws-sdk will always be a painful source of duplicates
  # "aws-config",
  # "aws-sdk-ecr",
  # "aws-sdk-s3",
  # "aws-sigv4",
  # handlebars crate utilizing derive_builder and we use bon, causing a dup on darling
  # "darling",

  # "ansi_term@0.11.0", # will be skipped along with _all_ of its direct and transitive dependencies
  # { crate = "ansi_term@0.11.0", depth = 20 },
]

[sources]
unknown-registry = "warn"
unknown-git      = "warn"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git        = []

[sources.allow-org]
github    = []
gitlab    = []
bitbucket = []
